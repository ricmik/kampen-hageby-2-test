media:
  - name: bilder
    label: Bilder
    input: assets/uploads
    output: /kampen-hageby-2-test/assets/uploads
    categories: [image]
  - name: sidebilder
    label: Bilder til nettsidene
    input: assets
    output: /kampen-hageby-2-test/assets
    categories: [image]
  - name: dokumentfiler
    label: Dokumenter (PDF)
    input: filer
    output: /kampen-hageby-2-test/filer
    extensions: [pdf]
content:
  - name: nyheter
    label: Nyheter
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Overskrift
        type: string
        required: true
      - name: date
        label: Publiseringsdato
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Kategori
        type: string
        description: For eksempel Informasjon fra styret, Vedlikehold eller Om nettsiden.
      - name: summary
        label: Kort ingress til forsiden
        type: text
        required: true
      - name: body
        label: Innhold
        type: rich-text
        options:
          format: markdown
          media: bilder
  - name: publiserte_dokumenter
    label: Publiserte dokumenter
    type: collection
    path: _dokumenter
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Dokumenttittel
        type: string
        required: true
      - name: file
        label: PDF-dokument
        type: file
        required: true
        options:
          media: dokumentfiler
      - name: date
        label: Dato
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Dokumenttype
        type: string
        description: For eksempel Vedtekter, Referat eller Årsberetning.
      - name: summary
        label: Kort beskrivelse
        type: text
  - name: faq
    label: Ofte stilte spørsmål
    type: collection
    path: _faq
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Spørsmål
        type: string
        required: true
      - name: body
        label: Svar
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
  - name: forside
    label: Forside – introduksjon
    type: file
    path: index.md
    format: yaml-frontmatter
    fields:
      - name: image
        label: Hovedbilde
        type: image
        required: true
        options:
          media: sidebilder
      - name: image_alt
        label: Beskriv bildet for skjermlesere
        type: string
        required: true
      - name: image_credit
        label: Fotograf og kilde
        type: string
      - name: image_credit_url
        label: Lenke til bildekilden
        type: string
      - name: image_license
        label: Bildelisens
        type: string
      - name: image_license_url
        label: Lenke til bildelisensen
        type: string
      - name: body
        label: Introduksjon under hovedoverskriften
        type: rich-text
        options:
          format: markdown
          media: false
  - name: retningslinjer
    label: Retningslinjer for bebyggelsen
    type: file
    path: retningslinjer.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Sidetittel
        type: string
        required: true
      - name: lead
        label: Ingress
        type: text
      - name: image
        label: Bilde på siden
        type: image
        required: true
        options:
          media: sidebilder
      - name: image_alt
        label: Beskriv bildet for skjermlesere
        type: string
        required: true
      - name: image_credit
        label: Fotograf og kilde
        type: string
      - name: image_credit_url
        label: Lenke til bildekilden
        type: string
      - name: image_license
        label: Bildelisens
        type: string
      - name: image_license_url
        label: Lenke til bildelisensen
        type: string
      - name: body
        label: Innhold
        type: rich-text
        options:
          format: markdown
          media: bilder
  - name: dokumenter
    label: Dokumenter fra sameiet
    type: file
    path: dokumenter.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Sidetittel
        type: string
        required: true
      - name: lead
        label: Ingress
        type: text
      - name: body
        label: Innhold og lenker
        type: rich-text
        options:
          format: markdown
          media: bilder
  - name: leverandorer
    label: Leverandører og tjenester
    type: file
    path: leverandorer.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Sidetittel
        type: string
        required: true
      - name: lead
        label: Ingress
        type: text
      - name: body
        label: Leverandører og lenker
        type: rich-text
        options:
          format: markdown
          media: bilder
