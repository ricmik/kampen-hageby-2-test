<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} – hjem">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M3 16 10 9l6 6 6-6 7 7M6 14v11h20V14M12 25v-7h8v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-name">Kampen Hageby 2<small>Sameiet · Oslo</small></span>
    </a>
    <nav class="desktop-nav" aria-label="Hovedmeny">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Hjem</a>
      <a href="{{ '/retningslinjer.html' | relative_url }}"{% if page.url == '/retningslinjer.html' %} aria-current="page"{% endif %}>Retningslinjer</a>
      <a href="{{ '/dokumenter.html' | relative_url }}"{% if page.url == '/dokumenter.html' %} aria-current="page"{% endif %}>Dokumenter fra sameiet</a>
      <a href="{{ '/leverandorer.html' | relative_url }}"{% if page.url == '/leverandorer.html' %} aria-current="page"{% endif %}>Leverandører og tjenester</a>
    </nav>
    <form class="header-search" action="{{ '/search.html' | relative_url }}" method="get">
      <label class="visually-hidden" for="site-search-input">Søk på nettsiden</label>
      <input id="site-search-input" type="search" name="q" placeholder="Søk..." aria-label="Søk på nettsiden">
      <button type="submit" aria-label="Søk">Søk</button>
    </form>
    <a class="header-action" href="{{ '/#siste-nytt' | relative_url }}">Siste nytt <span aria-hidden="true">↗</span></a>
    <details class="mobile-nav">
      <summary>Meny</summary>
      <nav aria-label="Mobilmeny">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Hjem</a>
        <a href="{{ '/#siste-nytt' | relative_url }}">Siste nytt</a>
        <a href="{{ '/retningslinjer.html' | relative_url }}"{% if page.url == '/retningslinjer.html' %} aria-current="page"{% endif %}>Retningslinjer</a>
        <a href="{{ '/dokumenter.html' | relative_url }}"{% if page.url == '/dokumenter.html' %} aria-current="page"{% endif %}>Dokumenter fra sameiet</a>
        <a href="{{ '/leverandorer.html' | relative_url }}"{% if page.url == '/leverandorer.html' %} aria-current="page"{% endif %}>Leverandører og tjenester</a>
        <a href="{{ '/search.html' | relative_url }}">Søk</a>
      </nav>
    </details>
  </div>
</header>
