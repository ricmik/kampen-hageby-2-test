<!doctype html>
<html lang="{{ site.lang | default: 'nb' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19392e">
  <meta name="description" content="{{ page.lead | default: page.excerpt | default: site.description | strip_html | escape }}">
  <title>{% if page.title and page.title != 'Hjem' %}{{ page.title | escape }} – {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#innhold">Hopp til innhold</a>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
