title: Sameiet Kampen Hageby 2
description: Nyheter, retningslinjer, dokumenter og nyttige lenker for beboere.
lang: nb
timezone: Europe/Oslo
# Prosjektside på GitHub Pages: bytt til "" ved eget domene eller brukernavn.github.io.
baseurl: "/kampen-hageby-2-test"
permalink: /nyhet-:title.html
collections:
  dokumenter:
    output: false
  faq:
    output: false
defaults:
  - scope:
      path: "index.md"
    values:
      layout: home
      permalink: /
  - scope:
      path: "retningslinjer.md"
    values:
      layout: page
      permalink: /retningslinjer.html
      eyebrow: Bebyggelsen
  - scope:
      path: "dokumenter.md"
    values:
      layout: page
      permalink: /dokumenter.html
      eyebrow: Praktisk informasjon
      document_list: true
  - scope:
      path: "leverandorer.md"
    values:
      layout: page
      permalink: /leverandorer.html
      eyebrow: Praktisk informasjon
  - scope:
      path: "ofte-stilte-sporsmal.md"
    values:
      layout: page
      permalink: /ofte-stilte-sporsmal.html
      eyebrow: Praktisk informasjon
      faq_list: true
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - .pages.yml
